name: Advisory AI pull request review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    # Do not expose DIGITALOCEAN_TOKEN to code or diffs supplied by forks.
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      !github.event.pull_request.draft
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      # Intentionally no checkout: the reviewer never executes pull-request code.
      - name: Run advisory review
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_EVENT_PATH: ${{ github.event_path }}
          DIGITALOCEAN_TOKEN: ${{ secrets.DIGITALOCEAN_TOKEN }}
          DIGITALOCEAN_MODEL: ${{ vars.DIGITALOCEAN_MODEL || 'openai-gpt-oss-20b' }}
        run: npx --yes tsx@4.19.2 src/review.ts
